services:
  - type: web
    name: mystic-nft-drop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: REQUIRED_CHANNEL
        value: "@MysticDropNFT"
      - key: DEV_MODE
        value: "false"
      - key: DB_PATH
        value: ./data/mystic.sqlite3
